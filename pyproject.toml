[project]
name = "onelease"
version = "0.1.0"
description = "Збір і аналіз оголошень оренди житла"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["ruff", "pytest", "pre-commit"]

[project.scripts]
onelease = "onelease.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"